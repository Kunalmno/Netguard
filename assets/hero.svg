<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">NetGuard — Network security management</title>
  <desc id="desc">A minimal title panel paired with a compact flow showing Snort telemetry moving through event triage into alerts and incidents.</desc>
  <rect width="1200" height="360" rx="18" fill="#f7f7f5"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#deded9"/>
  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="66" fill="#666660" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2.4">NETWORK SECURITY / OPERATIONS</text>
    <text x="60" y="166" fill="#171715" font-size="82" font-weight="700" letter-spacing="-3">NetGuard</text>
    <text x="64" y="218" fill="#393936" font-size="27" font-weight="500">Snort telemetry. Actionable alerts.</text>
    <text x="64" y="253" fill="#393936" font-size="27" font-weight="500">Focused incident response.</text>
    <line x1="64" y1="292" x2="520" y2="292" stroke="#d1d1cb" stroke-width="1.5"/>
    <text x="64" y="326" fill="#666660" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1.2">REACT 19  ·  EXPRESS  ·  TYPESCRIPT  ·  POSTGRESQL / PGLITE</text>
  </g>
  <g id="event-flow" transform="translate(650 64)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="0" y="0" fill="#666660" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1.8">THE OPERATIONS LOOP</text>
    <path d="M42 78 H445" stroke="#9a9a92" stroke-width="2" fill="none"/>
    <path d="M432 70 L445 78 L432 86" stroke="#9a9a92" stroke-width="2" fill="none"/>
    <g transform="translate(0 42)">
      <rect width="142" height="102" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.5"/>
      <circle cx="24" cy="25" r="6" fill="#222220"/>
      <text x="18" y="60" fill="#171715" font-size="23" font-weight="650">Snort</text>
      <text x="18" y="83" fill="#686861" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">IDS EVENTS</text>
    </g>
    <g transform="translate(166 42)">
      <rect width="142" height="102" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.5"/>
      <circle cx="24" cy="25" r="6" fill="#222220"/>
      <text x="18" y="60" fill="#171715" font-size="23" font-weight="650">Triage</text>
      <text x="18" y="83" fill="#686861" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">EVENT REVIEW</text>
    </g>
    <g transform="translate(332 42)">
      <rect width="142" height="102" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.5"/>
      <circle cx="24" cy="25" r="6" fill="#222220"/>
      <text x="18" y="60" fill="#171715" font-size="23" font-weight="650">Alerts</text>
      <text x="18" y="83" fill="#686861" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">INCIDENTS</text>
    </g>
    <g transform="translate(0 190)">
      <rect width="474" height="48" rx="8" fill="#ecece8" stroke="#d8d8d2"/>
      <text x="18" y="30" fill="#393936" font-size="18">Investigate  ·  Assign  ·  Record actions  ·  Respond</text>
    </g>
    <text x="0" y="284" fill="#777770" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1">LOCAL / LAB SOC WORKFLOW</text>
  </g>
</svg>
